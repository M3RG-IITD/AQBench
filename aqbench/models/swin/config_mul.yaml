
model: swin
exp_name: swin_mul
learning_rate: 1.0e-3     

use_compile: false

model_args:
  in_channels: 23         
  height:      140
  width:       124
  Tin:         6
  Tout:        6

  embed_dim:  72          
  num_heads:  [3, 6, 12, 24]  
  depths:         [2, 2, 2, 2]
  depths_decoder: [2, 4, 2, 2]   
  window_size:    4
  patch_size:     2

  mlp_ratio:      4
  dropout:        0.0
  attn_drop:      0.0
  drop_path_rate: 0.1
  use_checkpoint: false   

  time_embed_d: 16